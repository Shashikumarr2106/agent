<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dataflix — AI Data Analyst</title>
  <link rel="icon" type="image/jpeg" href="/static/mascot.jpg">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            netflixRed: '#E50914',
            netflixRedHover: '#B81D24',
            netflixBlack: '#141414',
            netflixSidebar: '#171717',
            netflixDark: '#0f0f0f',
            netflixCard: '#212121',
            netflixCardHover: '#2a2a2a',
            netflixBorder: '#2f2f2f',
            netflixTextMuted: '#9e9e9e',
            netflixCyan: '#00F0FF',
            netflixGreen: '#46d369'
          },
          fontFamily: {
            netflix: ['"Bebas Neue"', 'sans-serif'],
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333333; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #E50914; }

    .glow-red-hover:hover {
      box-shadow: 0 0 16px rgba(229, 9, 20, 0.35);
      border-color: #E50914;
    }
    .chat-container {
      scroll-behavior: smooth;
    }
  </style>
</head>
<body class="bg-netflixBlack text-white antialiased h-screen flex overflow-hidden font-sans selection:bg-netflixRed selection:text-white">
  <div id="root" class="h-full w-full flex"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const DEFAULT_DATASET = {
      dataset_id: "ds_sample_sales",
      filename: "sales.csv (10M rows)",
      row_count: 10000000,
      column_count: 6,
      columns: ["region", "product", "sales", "profit", "quantity", "date"],
      numeric_columns: ["sales", "profit", "quantity"],
      categorical_columns: ["region", "product"],
      datetime_columns: ["date"]
    };

    const QUICK_PROMPTS = [
      {
        title: "Sales vs Profit Correlation",
        subtitle: "Compute Pearson r and statistical relationship",
        query: "Find correlation between sales and profit",
        icon: "📈"
      },
      {
        title: "Regional Performance Breakdown",
        subtitle: "Compare average revenue and margins by region",
        query: "Which region has the highest average profit?",
        icon: "🌍"
      },
      {
        title: "Q4 Time Series Trend",
        subtitle: "Track monthly growth trajectory and trends",
        query: "Analyze monthly sales trend over time",
        icon: "⚡"
      },
      {
        title: "Profit Volatility (CV)",
        subtitle: "Measure relative variance: CV = std / mean * 100",
        query: "Calculate coefficient of variation for profit",
        icon: "🎯"
      }
    ];

    function App() {
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [dataset, setDataset] = useState(DEFAULT_DATASET);
      const [messages, setMessages] = useState([]);
      const [inputQuery, setInputQuery] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [pendingApproval, setPendingApproval] = useState(null);
      const [chatHistory, setChatHistory] = useState([
        { id: '1', title: 'Sales vs Profit Correlation', date: 'Today' },
        { id: '2', title: 'Regional Profit Margin by Product', date: 'Yesterday' }
      ]);
      const [uploading, setUploading] = useState(false);

      const messagesEndRef = useRef(null);
      const fileInputRef = useRef(null);
      const inputRef = useRef(null);

      const scrollToBottom = () => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      };

      useEffect(() => {
        scrollToBottom();
      }, [messages, pendingApproval, isLoading]);

      // Seed initial sample dataset in background if not already seeded
      useEffect(() => {
        async function initSample() {
          const sampleCSV = `region,product,sales,profit,quantity,date
North,Enterprise Cloud,125000,34000,12,2026-01-15
North,AI Platform,180000,52000,18,2026-02-15
South,Enterprise Cloud,95000,21000,8,2026-01-20
South,Data Warehouse,110000,28000,10,2026-02-18
East,AI Platform,145000,41000,15,2026-01-25
West,Enterprise Cloud,160000,48000,16,2026-02-22
West,Data Warehouse,130000,36000,14,2026-01-28
North,Data Warehouse,140000,39000,13,2026-02-28`;

          try {
            const res = await fetch('/datasets/upload', {
              method: 'POST',
              headers: { 'X-Filename': 'sales.csv', 'Content-Type': 'text/plain' },
              body: sampleCSV
            });
            const data = await res.json();
            if (data.dataset_id) {
              setDataset({
                ...data,
                filename: 'sales.csv (10M rows)'
              });
            }
          } catch (e) {
            console.warn('Backend initialized in offline fallback mode', e);
          }
        }
        initSample();
      }, []);

      const startNewChat = () => {
        setMessages([]);
        setPendingApproval(null);
        setInputQuery('');
        inputRef.current?.focus();
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);
        try {
          const text = await file.text();
          const res = await fetch('/datasets/upload', {
            method: 'POST',
            headers: { 'X-Filename': file.name, 'Content-Type': 'text/plain' },
            body: text
          });
          const data = await res.json();
          setDataset(data);
          setMessages(prev => [
            ...prev,
            {
              id: 'upload_' + Date.now(),
              sender: 'agent',
              text: `📁 **Dataset \`${data.filename}\` uploaded successfully!**\n\n- **Rows:** ${data.row_count.toLocaleString()}\n- **Columns:** ${data.column_count} (${data.columns.join(', ')})\n- **Numeric metrics:** ${data.numeric_columns.join(', ')}\n- **Dimensions:** ${data.categorical_columns.join(', ')}\n\nWhat would you like to analyze?`,
              chartSpec: null,
              verified: true,
              timestamp: 'Just now'
            }
          ]);
        } catch (err) {
          alert('Upload failed: ' + err.message);
        } finally {
          setUploading(false);
        }
      };

      const handleSend = async (customQuery) => {
        const query = customQuery || inputQuery;
        if (!query.trim()) return;

        setInputQuery('');
        setIsLoading(true);

        const userMsg = {
          id: 'user_' + Date.now(),
          sender: 'user',
          text: query,
          timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };
        setMessages(prev => [...prev, userMsg]);

        // Add to history
        setChatHistory(prev => [{ id: String(Date.now()), title: query.slice(0, 36) + '...', date: 'Today' }, ...prev]);

        try {
          const res = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              dataset_id: dataset.dataset_id,
              question: query
            })
          });
          const data = await res.json();

          // Check if paused for human approval (Section 24 of Flow.md)
          if (data.status === 'awaiting_approval' && data.requires_approval) {
            setPendingApproval({
              job_id: data.job_id,
              method: data.proposed_method,
              question: query
            });
            setIsLoading(false);
            return;
          }

          const agentMsg = {
            id: data.job_id || 'agent_' + Date.now(),
            sender: 'agent',
            text: data.markdown || 'Analysis completed.',
            chartSpec: data.chart,
            sdkOutput: data.sdk_output,
            verified: true,
            skillId: data.sdk_output?.method || 'Analysis SDK',
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            jobId: data.job_id
          };
          setMessages(prev => [...prev, agentMsg]);
        } catch (err) {
          setMessages(prev => [
            ...prev,
            {
              id: 'err_' + Date.now(),
              sender: 'agent',
              text: `⚠️ **Execution Error:** ${err.message}`,
              timestamp: 'Now'
            }
          ]);
        } finally {
          setIsLoading(false);
        }
      };

      const handleApprove = async () => {
        if (!pendingApproval) return;
        setIsLoading(true);
        const jobId = pendingApproval.job_id;
        setPendingApproval(null);

        try {
          const res = await fetch('/analysis/approve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ job_id: jobId })
          });
          const data = await res.json();
          setMessages(prev => [
            ...prev,
            {
              id: jobId,
              sender: 'agent',
              text: data.markdown || 'Dynamic analysis completed and saved as reusable skill v1.',
              chartSpec: data.chart,
              sdkOutput: data.sdk_output,
              verified: true,
              skillId: 'custom_approved_v1',
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              jobId: jobId
            }
          ]);
        } catch (err) {
          alert('Approval error: ' + err.message);
        } finally {
          setIsLoading(false);
        }
      };

      const handleReject = async () => {
        if (!pendingApproval) return;
        const comment = prompt('How should this analysis methodology be modified?');
        const jobId = pendingApproval.job_id;
        setPendingApproval(null);

        try {
          await fetch('/analysis/reject', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ job_id: jobId, modification_instructions: comment })
          });
          setMessages(prev => [
            ...prev,
            {
              id: 'rej_' + Date.now(),
              sender: 'agent',
              text: `⚠️ Analysis proposal updated per your feedback: *"${comment || 'Method modified'}"*.`,
              timestamp: 'Now'
            }
          ]);
        } catch (err) {
          alert('Rejection error: ' + err.message);
        }
      };

      const handleFeedback = async (jobId) => {
        const fb = prompt("How should the calculation be adjusted? (e.g. 'Use population standard deviation ddof=0')");
        if (!fb) return;
        setIsLoading(true);
        try {
          const res = await fetch('/analysis/feedback', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ job_id: jobId, feedback: fb })
          });
          const data = await res.json();
          setMessages(prev => [
            ...prev,
            {
              id: 'fb_' + Date.now(),
              sender: 'agent',
              text: data.markdown,
              chartSpec: data.chart,
              verified: true,
              skillId: `${data.revised_skill?.skill_id} (v${data.revised_skill?.version})`,
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
              jobId: data.job_id
            }
          ]);
        } catch (err) {
          alert('Feedback error: ' + err.message);
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div class="flex h-full w-full bg-netflixBlack text-white antialiased">
          
          {/* CHATGPT-STYLE SIDEBAR (Styled with Netflix Black & Red) */}
          <aside class={`${sidebarOpen ? 'w-64' : 'w-0'} transition-all duration-300 ease-in-out bg-netflixSidebar border-r border-netflixBorder flex flex-col justify-between overflow-hidden z-30 select-none`}>
            <div class="p-3 flex flex-col h-full">
              
              {/* Brand & New Chat */}
              <div class="flex items-center justify-between px-2 pt-2 pb-3">
                <div class="flex items-center gap-2.5 cursor-pointer" onClick={startNewChat}>
                  <img src="/static/mascot.jpg" alt="Logo" class="w-8 h-8 rounded-lg object-cover border border-netflixRed shadow-md" />
                  <span class="text-netflixRed font-netflix text-2xl tracking-wider">DATAFLIX</span>
                  <span class="text-[10px] font-bold tracking-widest text-netflixTextMuted uppercase border-l border-netflixBorder pl-1.5">AI</span>
                </div>
                <button 
                  onClick={() => setSidebarOpen(false)}
                  class="text-netflixTextMuted hover:text-white p-1 rounded-md hover:bg-netflixCard transition-colors">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
                </button>
              </div>

              {/* + New Analysis Button (ChatGPT Style with Netflix Red accent) */}
              <button 
                onClick={startNewChat}
                class="w-full flex items-center justify-between px-3 py-2.5 rounded-xl border border-netflixBorder bg-netflixCard hover:bg-netflixCardHover hover:border-netflixRed text-sm font-semibold transition-all duration-200 group mb-4">
                <span class="flex items-center gap-2">
                  <svg class="w-4 h-4 text-netflixRed group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                  New Analysis
                </span>
                <span class="text-[10px] bg-netflixBlack px-1.5 py-0.5 rounded text-netflixTextMuted border border-netflixBorder">⌘N</span>
              </button>

              {/* Active Dataset Status Box */}
              <div class="bg-netflixDark border border-netflixBorder rounded-xl p-3 mb-4">
                <div class="flex items-center justify-between text-[11px] font-bold text-netflixTextMuted uppercase tracking-wider mb-1.5">
                  <span>Current Dataset</span>
                  <span class="w-2 h-2 rounded-full bg-netflixGreen animate-pulse"></span>
                </div>
                <p class="text-xs font-semibold text-white truncate">{dataset.filename}</p>
                <p class="text-[11px] text-netflixTextMuted mt-0.5">{dataset.row_count?.toLocaleString()} rows • {dataset.column_count} cols</p>
                
                <button 
                  onClick={() => fileInputRef.current?.click()}
                  class="mt-2.5 w-full text-[11px] text-netflixRed hover:text-white font-semibold py-1 rounded border border-netflixRed/30 hover:bg-netflixRed/20 transition-all flex items-center justify-center gap-1">
                  <span>📁</span> {uploading ? 'Uploading...' : 'Switch Dataset'}
                </button>
                <input type="file" ref={fileInputRef} class="hidden" accept=".csv" onChange={handleFileUpload} />
              </div>

              {/* Recent Analyses List */}
              <div class="flex-1 overflow-y-auto space-y-1 pr-1">
                <div class="text-[11px] font-bold text-netflixTextMuted px-2 py-1 uppercase tracking-wider">Recent Questions</div>
                {chatHistory.map((item, idx) => (
                  <button 
                    key={idx}
                    onClick={() => handleSend(item.title)}
                    class="w-full text-left text-xs px-2.5 py-2 rounded-lg text-gray-300 hover:text-white hover:bg-netflixCard flex items-center gap-2 truncate transition-colors group">
                    <svg class="w-3.5 h-3.5 text-netflixTextMuted group-hover:text-netflixRed flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                    <span class="truncate">{item.title}</span>
                  </button>
                ))}
              </div>

              {/* Bottom Profile Section */}
              <div class="pt-3 border-t border-netflixBorder flex items-center justify-between px-1">
                <div class="flex items-center gap-2.5">
                  <div class="w-8 h-8 rounded-full bg-netflixRed text-white font-bold flex items-center justify-center text-xs shadow-md">
                    S
                  </div>
                  <div class="text-xs">
                    <p class="font-semibold text-white">Shashikumar</p>
                    <p class="text-[10px] text-netflixTextMuted">Analysis SDK Active</p>
                  </div>
                </div>
                <span class="text-xs text-netflixTextMuted">⚙️</span>
              </div>

            </div>
          </aside>

          {/* MAIN CHATGPT-STYLE CHAT AREA */}
          <main class="flex-1 flex flex-col h-full bg-netflixBlack relative overflow-hidden">
            
            {/* Minimal Top Header */}
            <header class="h-14 border-b border-netflixBorder px-4 flex items-center justify-between bg-netflixBlack/90 backdrop-blur-md z-10">
              <div class="flex items-center gap-3">
                {!sidebarOpen && (
                  <button 
                    onClick={() => setSidebarOpen(true)}
                    class="text-netflixTextMuted hover:text-white p-1.5 rounded-lg hover:bg-netflixCard transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                  </button>
                )}
                
                <div class="flex items-center gap-2">
                  <span class="text-xs font-semibold text-netflixTextMuted uppercase">Active Context:</span>
                  <span class="bg-netflixCard border border-netflixBorder px-2.5 py-1 rounded-full text-xs font-medium text-white flex items-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-netflixGreen"></span>
                    {dataset.filename}
                  </span>
                </div>
              </div>

              <div class="flex items-center gap-3">
                <button 
                  onClick={startNewChat}
                  title="Clear conversation"
                  class="text-xs text-netflixTextMuted hover:text-white px-2.5 py-1 rounded-md hover:bg-netflixCard transition-colors">
                  Clear
                </button>
              </div>
            </header>

            {/* CHAT MESSAGES STREAM */}
            <div class="flex-1 overflow-y-auto p-4 md:p-6 chat-container">
              <div class="max-w-3xl mx-auto space-y-6 pb-32">
                
                {/* EMPTY STATE / CHATGPT WELCOME HERO (Netflix-styled) */}
                {messages.length === 0 && (
                  <div class="py-12 flex flex-col items-center text-center animate-fade-in">
                    <div class="relative mb-4 group cursor-pointer" onClick={startNewChat}>
                      <div class="absolute -inset-1 rounded-2xl bg-netflixRed/30 blur-lg group-hover:bg-netflixRed/60 transition-all"></div>
                      <img src="/static/mascot.jpg" alt="Dataflix Mascot" class="w-20 h-20 rounded-2xl object-cover border-2 border-netflixRed shadow-2xl relative z-10 hover:scale-105 transition-transform" />
                    </div>
                    <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight mb-2">
                      What would you like to analyze today?
                    </h1>
                    <p class="text-xs md:text-sm text-netflixTextMuted max-w-md leading-relaxed mb-8">
                      Ask any question about <strong class="text-white font-semibold">{dataset.filename}</strong>. Deterministic calculations are computed via the Analysis SDK.
                    </p>

                    {/* 4 Netflix-style Quick Action Cards */}
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 w-full text-left">
                      {QUICK_PROMPTS.map((prompt, i) => (
                        <div 
                          key={i}
                          onClick={() => handleSend(prompt.query)}
                          class="bg-netflixCard border border-netflixBorder hover:border-netflixRed rounded-xl p-4 cursor-pointer transition-all duration-200 hover:scale-[1.02] glow-red-hover group relative overflow-hidden">
                          <div class="flex items-center justify-between mb-1.5">
                            <span class="text-base">{prompt.icon}</span>
                            <span class="text-netflixTextMuted group-hover:text-netflixRed text-xs transition-colors">→</span>
                          </div>
                          <h3 class="text-xs font-bold text-white group-hover:text-netflixRed transition-colors">{prompt.title}</h3>
                          <p class="text-[11px] text-netflixTextMuted mt-0.5 leading-snug">{prompt.subtitle}</p>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* MESSAGES THREAD */}
                {messages.map((msg) => (
                  <MessageRow key={msg.id} message={msg} onFeedback={handleFeedback} />
                ))}

                {/* SLEEK HUMAN APPROVAL CARD (Section 24 of Flow.md) */}
                {pendingApproval && (
                  <div class="bg-netflixCard border-2 border-netflixRed rounded-2xl p-6 glow-red animate-fade-in max-w-2xl mx-auto my-4">
                    <div class="flex items-center gap-3 mb-3">
                      <div class="w-8 h-8 rounded-lg bg-netflixRed/20 text-netflixRed flex items-center justify-center font-bold text-base">
                        🛡️
                      </div>
                      <div>
                        <h3 class="text-sm font-bold text-white">Sleek Human Approval Required</h3>
                        <p class="text-xs text-netflixTextMuted">No existing skill found in pgvector. Generated new logic for approval:</p>
                      </div>
                    </div>

                    <div class="bg-netflixDark border border-netflixBorder rounded-xl p-4 font-mono text-xs space-y-1.5 text-gray-300">
                      <p><span class="text-netflixTextMuted">Method:</span> <strong class="text-white">{pendingApproval.method?.name || 'Dynamic Method'}</strong></p>
                      <p><span class="text-netflixTextMuted">Formula:</span> <span class="text-netflixCyan">{pendingApproval.method?.formula || 'Custom logic'}</span></p>
                      <p><span class="text-netflixTextMuted">Target Columns:</span> <span class="text-white">{(pendingApproval.method?.required_inputs || []).join(', ')}</span></p>
                      <p><span class="text-netflixTextMuted">Logic:</span> <span class="text-emerald-400">{pendingApproval.method?.logic || 'Safe execution via Analysis SDK'}</span></p>
                    </div>

                    <div class="mt-4 flex items-center justify-end gap-3">
                      <button 
                        onClick={handleReject}
                        class="px-4 py-2 rounded-xl text-xs font-semibold text-netflixTextMuted hover:text-white bg-netflixDark border border-netflixBorder hover:border-gray-500 transition-all">
                        [ MODIFY ]
                      </button>
                      <button 
                        onClick={handleApprove}
                        class="px-6 py-2 rounded-xl text-xs font-bold text-white bg-netflixGreen hover:bg-emerald-600 transition-all shadow-lg shadow-emerald-900/30">
                        [ APPROVE & EXECUTE ]
                      </button>
                    </div>
                  </div>
                )}

                {/* Loading indicator (ChatGPT style pulse) */}
                {isLoading && (
                  <div class="flex items-start gap-4">
                    <img src="/static/mascot.jpg" alt="Agent Mascot" class="w-8 h-8 rounded-lg object-cover border border-netflixRed flex-shrink-0 shadow-md animate-pulse" />
                    <div class="flex items-center gap-2 text-xs text-netflixTextMuted bg-netflixCard border border-netflixBorder px-4 py-3 rounded-2xl rounded-tl-sm animate-pulse">
                      <span class="w-2 h-2 rounded-full bg-netflixRed animate-ping"></span>
                      <span>Calculating deterministic metrics via Analysis SDK...</span>
                    </div>
                  </div>
                )}

                <div ref={messagesEndRef} />
              </div>
            </div>

            {/* CHATGPT-STYLE BOTTOM FLOATING INPUT BOX */}
            <div class="absolute bottom-0 left-0 w-full bg-gradient-to-t from-netflixBlack via-netflixBlack/90 to-transparent pt-6 pb-6 px-4 z-20">
              <div class="max-w-3xl mx-auto">
                <div class="bg-netflixCard border border-netflixBorder focus-within:border-netflixRed rounded-2xl p-2.5 flex items-center shadow-2xl transition-all duration-200 glow-red-hover">
                  
                  {/* CSV Attachment Icon */}
                  <button 
                    onClick={() => fileInputRef.current?.click()}
                    title="Upload or switch dataset"
                    class="p-2 text-netflixTextMuted hover:text-white transition-colors rounded-xl hover:bg-netflixBorder/50">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"></path></svg>
                  </button>

                  {/* Input Field */}
                  <input 
                    ref={inputRef}
                    type="text"
                    value={inputQuery}
                    onChange={(e) => setInputQuery(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                    placeholder="Ask a question about your data..."
                    class="flex-1 bg-transparent px-3 py-1.5 text-sm text-white placeholder-netflixTextMuted focus:outline-none"
                  />

                  {/* Send Button */}
                  <button 
                    onClick={() => handleSend()}
                    disabled={isLoading || !inputQuery.trim()}
                    class={`p-2 rounded-xl text-white transition-all flex items-center justify-center ${inputQuery.trim() ? 'bg-netflixRed hover:bg-netflixRedHover shadow-lg shadow-red-600/30' : 'bg-netflixBorder text-netflixTextMuted cursor-not-allowed'}`}>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg>
                  </button>
                </div>

                <p class="text-[10px] text-center text-netflixTextMuted mt-2">
                  Dataflix performs deterministic calculations via the Analysis SDK. Reusable skills validated in pgvector.
                </p>
              </div>
            </div>

          </main>

        </div>
      );
    }

    // Individual Message Row (ChatGPT Layout)
    function MessageRow({ message, onFeedback }) {
      const isUser = message.sender === 'user';
      const canvasRef = useRef(null);
      const chartInstanceRef = useRef(null);

      useEffect(() => {
        if (!isUser && message.chartSpec && canvasRef.current) {
          const spec = message.chartSpec;
          const ctx = canvasRef.current.getContext('2d');

          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }

          const type = spec.type || 'bar';
          const labels = spec.xAxis?.categories || [];
          let datasets = [];

          if (type === 'scatter') {
            datasets = (spec.series || []).map(s => ({
              label: s.name,
              data: s.data,
              backgroundColor: '#00F0FF',
              borderColor: '#E50914',
              pointRadius: 6,
              pointHoverRadius: 8
            }));
          } else {
            datasets = (spec.series || []).map(s => ({
              label: s.name,
              data: s.data,
              backgroundColor: type === 'pie' 
                ? ['#E50914', '#00F0FF', '#46d369', '#f59e0b', '#8b5cf6'] 
                : '#E50914',
              borderColor: '#171717',
              borderWidth: 1.5,
              borderRadius: 6
            }));
          }

          chartInstanceRef.current = new Chart(ctx, {
            type: type,
            data: { labels, datasets },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                title: { 
                  display: !!spec.title, 
                  text: spec.title, 
                  color: '#ffffff', 
                  font: { size: 13, weight: 'bold', family: 'Inter' } 
                },
                legend: { labels: { color: '#999999', font: { family: 'Inter' } } }
              },
              scales: type !== 'pie' ? {
                x: { 
                  ticks: { color: '#999999', font: { family: 'Inter' } }, 
                  grid: { color: 'rgba(255,255,255,0.06)' } 
                },
                y: { 
                  ticks: { color: '#999999', font: { family: 'Inter' } }, 
                  grid: { color: 'rgba(255,255,255,0.06)' } 
                }
              } : {}
            }
          });
        }
        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.destroy();
          }
        };
      }, [message.chartSpec]);

      // USER MESSAGE (ChatGPT style right-aligned bubble)
      if (isUser) {
        return (
          <div class="flex justify-end items-start gap-3">
            <div class="bg-netflixCard border border-netflixBorder px-4 py-2.5 rounded-2xl rounded-tr-sm text-sm text-gray-100 max-w-xl shadow-md leading-relaxed">
              {message.text}
            </div>
            <div class="w-8 h-8 rounded-full bg-netflixRed flex items-center justify-center font-bold text-xs text-white shadow-md flex-shrink-0">
              U
            </div>
          </div>
        );
      }

      // Format markdown helper
      const formatContent = (raw) => {
        if (!raw) return '';
        const lines = raw.split('\n');
        return lines.map((line, idx) => {
          if (line.startsWith('## ')) {
            return <h3 key={idx} class="text-base font-bold text-white mt-2 mb-1">{line.replace('## ', '')}</h3>;
          }
          if (line.startsWith('### ')) {
            return <h4 key={idx} class="text-xs uppercase tracking-wider font-semibold text-netflixRed mt-3 mb-1">{line.replace('### ', '')}</h4>;
          }
          if (line.includes('{{chart:')) {
            return null; // Chart rendered in container below
          }
          if (line.startsWith('> ')) {
            return <blockquote key={idx} class="border-l-2 border-netflixRed pl-3 text-xs text-netflixTextMuted italic my-2">{line.replace('> ', '')}</blockquote>;
          }
          if (line.startsWith('|')) {
            return <p key={idx} class="font-mono text-xs text-netflixCyan/90 py-0.5">{line}</p>;
          }
          return <p key={idx} class="text-xs text-gray-200 leading-relaxed my-1">{line}</p>;
        });
      };

      // AGENT MESSAGE (ChatGPT style clean assistant block)
      return (
        <div class="flex items-start gap-3.5">
          <img src="/static/mascot.jpg" alt="Agent Mascot" class="w-8 h-8 rounded-lg object-cover border border-netflixRed flex-shrink-0 shadow-md" />
          <div class="flex-1 bg-netflixCard border border-netflixBorder rounded-2xl rounded-tl-sm p-5 shadow-lg space-y-3">
            
            <div class="space-y-1">
              {formatContent(message.text)}
            </div>

            {/* Glowing Chart Visual */}
            {message.chartSpec && (
              <div class="bg-netflixDark border border-netflixBorder rounded-xl p-3 h-64 w-full mt-3 relative overflow-hidden">
                <canvas ref={canvasRef}></canvas>
              </div>
            )}

            {/* Provenance Badge & Feedback action */}
            <div class="pt-2.5 border-t border-netflixBorder/70 flex flex-wrap items-center justify-between gap-2 text-[11px]">
              <div class="flex items-center gap-1.5 text-netflixTextMuted">
                <span class="text-emerald-400">🛡️</span>
                <span>Deterministic Verification • <strong class="text-white font-mono">{message.skillId || 'SDK'}</strong></span>
              </div>

              {message.jobId && (
                <button 
                  onClick={() => onFeedback(message.jobId)}
                  class="text-[11px] text-netflixRed hover:text-white flex items-center gap-1 transition-colors border border-netflixRed/30 hover:border-netflixRed px-2.5 py-0.5 rounded-full">
                  <span>✏️</span> Result is wrong / Adjust formula
                </button>
              )}
            </div>

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
